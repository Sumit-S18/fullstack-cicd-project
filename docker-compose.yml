
services:
  frontend:
    build:
      context: ./frontend
    image: frontend:latest
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: backend:latest
    environment:
      MONGO_URL: mongodb://mongodb:27017/studentdb
    restart: unless-stopped
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
