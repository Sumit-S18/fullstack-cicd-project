services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:latest

  mongodb:
    image: mongo:7

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
